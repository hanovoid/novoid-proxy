[package]
name = "novoid-proxy"
version = "2.0.0"
edition = "2021"
description = "High-performance Rust 2-tier AI proxy and smart model router for AI coding CLIs"
license = "MIT"

[lib]
name = "novoid_proxy"
path = "src/lib.rs"

[[bin]]
name = "novoid-proxy"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "deflate", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
